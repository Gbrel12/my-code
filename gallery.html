<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Bajak Laut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --sea:#0e3b5c; --sea-dark:#08243a; --parchment:#f0dca8; --ink:#3a2414; --red:#a3281c; --gold:#e8b73b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Special Elite", "Courier New", monospace; color: var(--ink); line-height: 1.55;
    padding: clamp(12px, 4vw, 40px); min-height: 100vh;
    background: repeating-linear-gradient(100deg, transparent 0 60px, rgba(255,255,255,.04) 60px 62px), linear-gradient(180deg, var(--sea), var(--sea-dark));
  }
  h1 { font-family: "Rye", Georgia, serif; font-weight: 400; }

  .board {
    max-width: 900px; margin: 0 auto; padding: clamp(20px, 5vw, 40px);
    background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 50%), var(--parchment);
    border: 10px double var(--ink); box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: clamp(2rem, 7vw, 3.2rem); text-align: center; color: var(--red); }
  .sub { text-align: center; margin: 4px 0 20px; }

  .bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  button, .add {
    font: 1rem "Rye", serif; padding: 10px 22px; cursor: pointer;
    background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 6px;
  }
  .clear { background: transparent; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .item { position: relative; }
  .item img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 4px solid var(--ink); cursor: zoom-in; display: block; }
  .item .del {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0;
    border-radius: 50%; font: 1rem sans-serif; line-height: 1; background: var(--red); color: #fff; border: 2px solid var(--ink);
  }
  .empty { text-align: center; opacity: .75; padding: 30px 0; }

  .lightbox { position: fixed; inset: 0; z-index: 10; padding: 20px; display: none; place-items: center; background: rgba(0,0,0,.88); cursor: zoom-out; }
  .lightbox.show { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border: 6px solid var(--parchment); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 1.6rem; padding: 8px 16px; }
  .prev { left: 14px; } .next { right: 14px; }

  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>

<main class="board">
  <h1>Galeri Bajak Laut</h1>
  <p class="sub">Kumpulan foto petualanganmu</p>

  <div class="bar">
    <label class="add">+ Tambah foto
      <input type="file" accept="image/*" multiple id="input" hidden>
    </label>
    <button class="clear" id="clear">Hapus semua</button>
  </div>

  <p class="empty" id="empty">Belum ada foto. Klik "Tambah foto" untuk mulai.</p>
  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="nav prev" id="prev" aria-label="Foto sebelumnya">&#8249;</button>
  <img alt="Foto besar">
  <button class="nav next" id="next" aria-label="Foto berikutnya">&#8250;</button>
</div>

<script>
var photos = [];          // daftar foto (data URL)
var current = 0;
var grid = document.getElementById('grid');
var empty = document.getElementById('empty');
var lightbox = document.getElementById('lightbox');
var big = lightbox.querySelector('img');

function render() {
  grid.innerHTML = '';
  photos.forEach(function (src, i) {
    var box = document.createElement('div');
    box.className = 'item';

    var img = document.createElement('img');
    img.src = src;
    img.alt = 'Foto galeri ' + (i + 1);
    img.addEventListener('click', function () { openBox(i); });

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', 'Hapus foto ' + (i + 1));
    del.addEventListener('click', function () { photos.splice(i, 1); render(); });

    box.appendChild(img);
    box.appendChild(del);
    grid.appendChild(box);
  });
  empty.style.display = photos.length ? 'none' : 'block';
}

function openBox(i) {
  current = i;
  big.src = photos[current];
  lightbox.classList.add('show');
}
function closeBox() { lightbox.classList.remove('show'); }
function step(n) {
  current = (current + n + photos.length) % photos.length;
  big.src = photos[current];
}

document.getElementById('input').addEventListener('change', function () {
  Array.from(this.files).forEach(function (f) {
    var r = new FileReader();
    r.onload = function () { photos.push(r.result); render(); };
    r.readAsDataURL(f);
  });
  this.value = '';
});

document.getElementById('clear').addEventListener('click', function () {
  if (photos.length && confirm('Hapus semua foto dari galeri?')) { photos = []; render(); }
});

lightbox.addEventListener('click', function (e) { if (e.target === lightbox || e.target === big) closeBox(); });
document.getElementById('prev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
document.addEventListener('keydown', function (e) {
  if (!lightbox.classList.contains('show')) return;
  if (e.key === 'Escape') closeBox();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

render();
</script>
</body>
</html>
